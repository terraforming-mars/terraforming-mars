<!DOCTYPE html>
<html>
  <meta charset="utf-8">
  <head>
    <script src="https://d3js.org/d3.v4.js"></script>
  </head>
  <body>
    <form>
      <label for="runs">Runs: </label><input type="text" id="runs" value="10000" name="runs"><br/>
      <label for="board">Board: </label><select id="board" name="board">
        <option value="tharsis">tharsis</option>
        <option value="hellas">hellas</option>
        <option value="elysium">elysium</option>
        <option value="utopia planitia">utopia planitia</option>
        <option value="vastitas borealis nova">vastitas borealis nova</option>
        <option value="terra cimmeria nova">terra cimmeria nova</option>
        <option value="amazonis planitia">amazonis planitia</option>
        <option value="arabia terra">arabia terra</option>
        <option value="vastitas borealis">vastitas borealis</option>
        <option value="amazonis p.">amazonis p.</option>
        <option value="t. cimmeria">t. cimmeria</option>
        <option value="Hollandia">Hollandia</option>
      </select><br/>
      <label for="venus">Venus: </label><input type="checkbox" id="venus" name="venus"><br/>
      <label for="colonies">Colonies: </label><input type="checkbox" id="colonies" name="colonies"><br/>
      <label for="turmoil">Turmoil: </label><input type="checkbox" id="turmoil" name="turmoil"><br/>
      <label for="ares">Ares: </label><input type="checkbox" id="ares" name="ares"><br/>
      <label for="moon">The Moon: </label><input type="checkbox" id="moon" name="moon"><br/>
      <label for="pathfinders">Pathfinders: </label><input type="checkbox" id="pathfinders" name="pathfinders"><br/>
      <label for="underworld">Underworld: </label><input type="checkbox" id="underworld" name="underworld"><br/>
      <label for="fan-maps">Fan MAs: </label><input type="checkbox" id="fan-maps" name="fan-maps"><br/>
      <label for="modular">Modular MAs: </label><input type="checkbox" id="modular" name="modular"><br/>

      <input type="radio" id="none" name="type" value="NONE"><label for="none">None</label>&nbsp;
      <input type="radio" id="limited" name="type" value="LIMITED" checked><label for="limited">Limited</label>&nbsp;
      <input type="radio" id="full" name="type" value="FULL"><label for="full">Full</label></br>

    </form>
    <button onclick="submit()">Submit</button>
    <p id="breaks"></p>
    <div id="viz"></div>
    <div id="raw"></div>

    <script type="text/javascript">
      // set the dimensions and margins of the graph
      var margin = {top: 30, right: 30, bottom: 70, left: 60};
      var width = 1200 - margin.left - margin.right;
      var height = 400 - margin.top - margin.bottom;

      function submit() {
        var svg = d3.select("#viz")
          .html("")
          .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
          .append("g")
            .attr("transform",
                  "translate(" + margin.left + "," + margin.top + ")");

        var params = new URLSearchParams();
        params.set("runs", d3.select("#runs").property("value"));
        params.set("board", d3.select("#board").property("value"));
        for (const name of ["venus", "colonies", "turmoil", "ares", "moon", "pathfinders", "underworld", "fan-maps", "modular"]) {
          params.set(name, d3.select("#" + name).property("checked"));
        }
        params.set("type", d3.select('input[name="type"]:checked').node().value);
        var url = "/data?" + params.toString();

        d3.csv(url, (data) => process(svg, data));
      }

      function process(svg, data) {
        // Draws that broke are reported on their own line, not as a bar.
        var runs = Number(d3.select("#runs").property("value"));
        var breaks = data.filter((d) => d.name === "ERROR").map((d) => Number(d.count))[0] || 0;
        d3.select("#breaks").text(`Breaks: ${breaks} of ${runs} draws (${(100 * breaks / runs).toFixed(2)}%)`);
        data = data.filter((d) => d.name !== "ERROR");

        // X axis
        var x = d3.scaleBand()
          .range([0, width])
          .domain(data.map((d) => d.name))
          .padding(0.2);
        svg.append("g")
          .attr("transform", "translate(0," + height + ")")
          .call(d3.axisBottom(x))
          .selectAll("text")
            .attr("transform", "translate(-10,0)rotate(-45)")
            .style("text-anchor", "end");

        // Add Y axis
        var y = d3.scaleLinear()
          .domain([0, Math.max(...data.map((d) => d.count))])
          .range([height, 0]);
        svg.append("g")
          .call(d3.axisLeft(y));

        // Bars
        svg.selectAll("mybar")
          .data(data)
          .enter()
          .append("rect")
            .attr("x", (d) => x(d.name))
            .attr("y", (d) => y(d.count))
            .attr("width", x.bandwidth())
            .attr("height", (d) => height - y(d.count))
            .attr("fill", "#69b3a2");

          d3.select("#raw").html("").append("code").text(data.map((e) => `${e.name}: ${e.count}`).join('\n'));
        }
    </script>
  </body>
</html>
